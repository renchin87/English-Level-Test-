const $=s=>document.querySelector(s),app=$("#app");let S={};
$("#th").onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark"};
const E=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function home(){
app.innerHTML=`<div class="fade"><h2>Түвшнээ сонгоно уу</h2><p style="color:var(--mut)">Түвшин бүр Grammar 50 + Vocabulary 50 асуулттай.</p><div class="grid">${L.map(l=>`<button class="lv" onclick="selectType('${l[0]}')"><b>${l[0]}</b>${l[1]}<br><small>${l[2]} · 100 асуулт</small></button>`).join("")}</div></div>`;
}
function selectType(level){
app.innerHTML=`<div class="fade"><button class="btn s" onclick="home()" style="margin-bottom:12px">← Буцах</button>
<h2><b>${level}</b> — Сорилын төрөл</h2><div class="grid" style="grid-template-columns:1fr;margin-top:16px">
<button class="lv" onclick="start('${level}','grammar')"><b>📝 Grammar</b><small>50 дүрмийн асуулт</small></button>
<button class="lv" onclick="start('${level}','vocabulary')"><b>📚 Vocabulary</b><small>50 үгсийн сангийн асуулт</small></button>
</div></div>`;
}
function start(l,type){
const list=Q[l]?.[type]||[];
if(!list.length){alert("Асуулт олдсонгүй.");return}
S={l,type,q:list,i:0,a:Array(list.length).fill(null),d:Array(list.length).fill(false)};
quiz();
}
function explanation(c,u){
return c[1].map((o,j)=>`<div class="ex ${j===c[2]?'ok':'no'}"><b>${"ABCD"[j]}. ${E(o)} ${j===c[2]?'✅':'❌'}</b>${j===u?' <small>(Таны хариулт)</small>':''}<br>${j===c[2]?'Яагаад зөв вэ:':'Яагаад буруу вэ:'} ${E(c[3])}</div>`).join("");
}
function quiz(){
const {q,i,a,d,l,type}=S,c=q[i],n=q.length,sub=d[i],answered=d.filter(Boolean).length;
app.innerHTML=`<div class="fade">
<div class="row" style="justify-content:space-between;align-items:center"><div><b>${l}</b> <span class="badge">${type.toUpperCase()}</span></div><span>Асуулт ${i+1} / ${n}</span></div>
<div class="bar"><i style="width:${answered/n*100}%"></i></div>
<div class="card"><h3>${E(c[0])}</h3>${c[1].map((o,j)=>`<button class="opt ${a[i]===j?'sel':''} ${sub?(j===c[2]?'ok':a[i]===j?'no':''):''}" ${sub?'disabled':''} onclick="pick(${j})"><b>${"ABCD"[j]}.</b> ${E(o)}</button>`).join("")}</div>
${sub?`<div class="card"><h3>${a[i]===c[2]?'✅ Зөв!':'❌ Буруу'}</h3><p>Зөв хариулт: <b>${"ABCD"[c[2]]}. ${E(c[1][c[2]])}</b></p>${explanation(c,a[i])}</div>`:''}
<div class="row"><button class="btn s" onclick="go(-1)" ${i?'':'disabled'}>← Өмнөх</button>
<button class="btn" onclick="submitAnswer()" ${sub||a[i]===null?'disabled':''}>Хариу шалгах</button>
<button class="btn s" onclick="go(1)" ${i<n-1?'':'disabled'}>Дараагийн →</button></div>
${answered===n?'<p><button class="btn" style="width:100%;margin-top:10px" onclick="result()">🏆 Үр дүн харах</button></p>':''}
</div>`;
}
function pick(j){if(!S.d[S.i]){S.a[S.i]=j;quiz()}}
function submitAnswer(){S.d[S.i]=true;quiz()}
function go(x){S.i=Math.max(0,Math.min(S.q.length-1,S.i+x));quiz()}
function result(){
const {q,a,l,type}=S,n=q.length,ok=q.filter((c,i)=>a[i]===c[2]).length,p=Math.round(ok/n*100);
const m=p>=90?"Гайхалтай! Та энэ түвшнийг маш сайн эзэмшсэн байна.":p>=70?`Сайн байна! Та ${l} түвшний даалгаврыг ихэнхдээ зөв гүйцэтгэлээ.`:p>=50?"Дунд зэрэг. Алдсан асуултуудаа давтаарай.":"Энэ түвшинд илүү дадлага хийж, тайлбаруудыг давтаарай.";
const wrong=q.map((c,i)=>a[i]===c[2]?'':`<div class="card"><b>${i+1}. ${E(c[0])}</b><p>Таны хариулт: <b>${a[i]==null?'Хариулаагүй':`${"ABCD"[a[i]]}. ${E(c[1][a[i]])}`}</b> ❌<br>Зөв хариулт: <b>${"ABCD"[c[2]]}. ${E(c[1][c[2]])}</b> ✅</p>${explanation(c,a[i])}</div>`).join("");
app.innerHTML=`<div class="fade"><h2>🎉 Таны үр дүн</h2><div class="card" style="text-align:center">
<div class="ring" style="background:conic-gradient(var(--pr) ${p*3.6}deg,var(--bd) 0)"><span>${p}%</span></div>
<div class="stat"><div><b>${ok}</b>Зөв</div><div><b>${n-ok}</b>Буруу</div><div><b>${p}%</b>Оноо</div></div>
<p>Level: <b>${l}</b> · ${type.toUpperCase()}</p><p>${m}</p></div>
<div class="row"><button class="btn" onclick="start('${l}','${type}')">Дахин өгөх</button><button class="btn s" onclick="selectType('${l}')">Бусад төрөл</button></div>
<h2>Алдсан асуултууд</h2>${wrong||'<div class="card">🎉 Бүх асуултад зөв хариуллаа!</div>'}</div>`;
}
home();
</script>
